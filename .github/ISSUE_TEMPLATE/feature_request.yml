name: Feature Request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Desired behavior
      description: What would you like OpenKnowledge to do?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought about (optional).
