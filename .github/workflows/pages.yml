# 官网（site/）发布到 GitHub Pages：推 master 且 site/ 有变化时自动部署。
# 需在仓库 Settings → Pages 选 "GitHub Actions" 作为 source（本仓库已 API 设置 build_type=workflow）。
name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
