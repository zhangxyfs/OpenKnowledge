name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Environment
      options:
        - Windows installer
        - Windows portable (dist)
        - Linux tar.gz
        - Linux deb
        - Built from source
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: The OpenKnowledge version you're running (see the GUI status card or `ok --version`).
  - type: textarea
    attributes:
      label: Logs
      description: Relevant lines from the GUI log page or daemon.log.
      render: text
