<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · 条目编辑内联化（详情区三态）</title>
<!--
  一次性原型（throwaway）：管理页条目「编辑弹窗 → 详情区内联编辑」改版稿。
  背景：v2 管理页的条目编辑沿用 640px 弹窗（见 web/app.js editModal_open），正文只有 10 行 textarea，太小。
  本稿：点「编辑」后右侧详情区直接进入编辑模式，三态切换——
    只读态（read）：照抄 prototype-manager-v2.html 的 renderDetail 文档流（d-path/d-filemeta/d-title/d-attrs/d-summary/d-body），
                    d-attrs 行右端放「编辑」按钮；
    编辑态（edit）：顶部操作行 = 取消 / 保存 / ✨优化（保存成功后三按钮随编辑态一起消失，回到只读详情）；
                    字段排布 = 标题整行 → 类型/tags/mandatory 收进一行 → 摘要整行 → 正文 textarea 撑满剩余高度（主要诉求）；
    优化对照态（cmp）：✨优化后进入——小字段（标题/tags/摘要）在上做 old→new 紧凑对照（可逐字段回填），
                    正文区左右分栏对照（原内容 | 优化后），顶部「全部接受并回填 / 放弃」；
                    接受/放弃都回到编辑态（回填只改表单，点「保存」才落盘——沿用生产语义 web/app.js openCmpModal）。
  DOM 结构/类名照抄 prototype-manager-v2.html 管理页（topbar/side/tree/detail/badge/md/btn/pinput），
  cmp-* 配色照抄 web/style.css 对照预览弹窗；树为简化静态假数据。
  右下角「演示控制」条为原型专用（非产品 UI），直接切三态；也支持 #edit / #cmp 锚点。
-->
<style>
  :root {
    --bg:#f5f6f8; --fg:#1f2329; --muted:#6b7280; --border:#d9dce1;
    --card:#ffffff; --primary:#2563eb; --sel-bg:#eff6ff; --sel-fg:#1d4ed8;
    --hover:#f3f4f6; --menu-bg:#ffffff; --code-bg:#f1f5f9; --pre-bg:#14171f; --pre-fg:#d6dae4;
    --born-bg:#4E5D73; --born-fg:#fff;
    --pitfall-bg:#fee2e2; --pitfall-fg:#b91c1c;
    --note-bg:#dbeafe; --note-fg:#1d4ed8;
    --rule-bg:#ede9fe; --rule-fg:#6d28d9;
    --ref-bg:#e0e7ff; --ref-fg:#3730a3;
    --mand-bg:#fef3c7; --mand-fg:#92400e;
    --draft-fg:#6b7280; --draft-bd:#d1d5db;
    --tag-bg:#eef2f7; --tag-fg:#475569;
    --ok:#16a34a; --ok-bg:#dcfce7;
  }
  [data-theme="dark"] {
    --bg:#14171f; --fg:#d6dae4; --muted:#8a8f9c; --border:#262c38;
    --card:#1a1f2a; --primary:#79b8ff; --sel-bg:#24304a; --sel-fg:#79b8ff;
    --hover:#1f2430; --menu-bg:#0f1218; --code-bg:#0f1218; --pre-bg:#0f1218; --pre-fg:#d6dae4;
    --born-bg:#4E5D73; --born-fg:#fff;
    --pitfall-bg:#3f1d1d; --pitfall-fg:#f87171;
    --note-bg:#1e2a45; --note-fg:#79b8ff;
    --rule-bg:#2a2340; --rule-fg:#c4b5fd;
    --ref-bg:#232a45; --ref-fg:#a5b4fc;
    --mand-bg:#3a2f14; --mand-fg:#fbbf24;
    --draft-fg:#8a8f9c; --draft-bd:#3a4150;
    --tag-bg:#232a38; --tag-fg:#aab2c0;
    --ok:#4ade80; --ok-bg:#14301e;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--fg); transition:background .15s,color .15s; }
  button { font:inherit; color:inherit; }

  .proto-banner { position:fixed; top:10px; right:230px; z-index:99; background:#fff7ed; border:1px solid #fdba74; color:#9a3412; padding:3px 10px; border-radius:6px; font-size:12px; }
  [data-theme="dark"] .proto-banner { background:#3a2a14; }
  /* 演示控制条：原型专用，直接切详情区三态（非产品 UI） */
  .demo-bar { position:fixed; right:18px; bottom:16px; z-index:99; background:#fff7ed; border:1px solid #fdba74;
              color:#9a3412; border-radius:8px; padding:6px 10px; display:flex; align-items:center; gap:6px; font-size:12px; }
  [data-theme="dark"] .demo-bar { background:#3a2a14; }
  .demo-bar button { border:1px solid #fdba74; background:none; color:inherit; border-radius:5px; padding:2px 10px; cursor:pointer; font-size:12px; }
  .demo-bar button.on { background:#9a3412; color:#fff7ed; }

  /* ---------- 顶栏（照抄 v2） ---------- */
  .topbar { display:flex; align-items:center; gap:10px; height:52px; padding:0 14px;
            background:var(--card); border-bottom:1px solid var(--border); }
  .collapse-btn { width:32px; height:32px; border:none; background:none; border-radius:6px;
                  cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .collapse-btn:hover { background:var(--hover); color:var(--fg); }
  .brand { font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; }
  .brand .logo { width:22px; height:22px; border-radius:6px; background:var(--primary); color:#fff;
                 display:flex; align-items:center; justify-content:center; font-size:12px; }
  .lang-seg { display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; margin-left:auto; }
  .lang-seg button { border:none; background:none; padding:4px 12px; cursor:pointer; font-size:12px; color:var(--muted); }
  .lang-seg button.on { background:var(--fg); color:var(--bg); font-weight:600; }
  .theme-btn { width:32px; height:32px; border:none; background:none; border-radius:999px;
               cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .theme-btn:hover { background:var(--hover); color:var(--fg); }

  /* ---------- 主体 / 侧栏（照抄 v2） ---------- */
  .main { display:flex; height:calc(100vh - 52px); }
  .side { width:180px; background:var(--menu-bg); border-right:1px solid var(--border);
          padding:10px 8px; display:flex; flex-direction:column; gap:2px;
          transition:width .15s; overflow:hidden; flex:none; }
  .side.collapsed { width:52px; padding:10px 4px; }
  .mi { display:flex; align-items:center; gap:10px; padding:9px 12px; border:none; background:none;
        border-radius:6px; color:var(--muted); cursor:pointer; text-align:left; width:100%; white-space:nowrap; }
  .mi:hover { background:var(--hover); color:var(--fg); }
  .mi.active { background:var(--sel-bg); color:var(--sel-fg); font-weight:600; }
  .mi .ico { width:18px; flex:none; display:flex; align-items:center; justify-content:center; }
  .mi .tip { display:none; }
  .side.collapsed .mi { padding:9px 0; justify-content:center; position:relative; }
  .side.collapsed .mi .txt { display:none; }
  .side.collapsed .mi .tip { position:fixed; margin-left:46px; margin-top:-30px; background:#111827; color:#fff;
                             font-size:12px; padding:3px 10px; border-radius:4px; white-space:nowrap; z-index:50; }
  .side.collapsed .mi:hover .tip { display:block; }

  /* 树（照抄 v2：过滤框 + 紧凑叶节点） */
  .tree { width:272px; background:var(--card); border-right:1px solid var(--border);
          display:flex; flex-direction:column; flex:none; }
  .tree-head { padding:10px 10px 6px; display:flex; gap:6px; align-items:center; }
  .tree-head .caption { font-size:12px; font-weight:600; color:var(--muted); margin-right:auto; }
  .search { margin:0 10px 8px; padding:5px 10px; border:1px solid var(--border); border-radius:6px;
            width:calc(100% - 20px); background:var(--bg); color:var(--fg); font-size:12.5px; }
  .search::placeholder { color:var(--muted); }
  .tree-scroll { overflow-y:auto; flex:1; padding:0 6px 10px; }
  .tn-proj { display:flex; align-items:center; gap:5px; width:100%; border:none; background:none;
             padding:5px 8px; border-radius:6px; cursor:pointer; font-weight:600; text-align:left; font-size:13px; }
  .tn-proj:hover { background:var(--hover); }
  .tn-proj .caret { width:12px; color:var(--muted); transition:transform .12s; flex:none; font-size:10px; }
  .tn-proj.open .caret { transform:rotate(90deg); }
  .tn-proj .folder { color:var(--muted); display:flex; flex:none; }
  .tn-proj .cnt { margin-left:auto; color:var(--muted); font-size:11px; font-weight:400; }
  .tn-kids { margin-left:15px; border-left:1px solid var(--border); padding-left:4px; }
  .leaf { display:block; width:100%; border:none; background:none; text-align:left;
          padding:4px 7px; border-radius:6px; cursor:pointer; }
  .leaf:hover { background:var(--hover); }
  .leaf.sel { background:var(--sel-bg); box-shadow:inset 2px 0 0 var(--primary); }
  .leaf .l1 { display:flex; gap:4px; align-items:center; }
  .leaf .t2 { display:block; font-size:12.5px; line-height:1.45; color:var(--fg); overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }
  .leaf.sel .t2 { color:var(--sel-fg); }

  /* 详情（照抄 v2 文档流） */
  .detail { flex:1; overflow-y:auto; padding:20px 28px 60px; }
  .d-path { font:12px/1.5 "Cascadia Code",Consolas,monospace; color:var(--muted); word-break:break-all; }
  .d-filemeta { color:var(--muted); font-size:13px; margin-top:2px; }
  .d-filemeta b { color:var(--fg); font-weight:600; }
  .d-title { font-size:20px; margin:10px 0 6px; }
  .d-attrs { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .d-summary { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--primary);
               border-radius:6px; padding:10px 14px; margin-bottom:16px; }
  .d-body { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:18px 22px; }

  /* 徽标（照抄 v2） */
  .badge-born { background:var(--born-bg); color:var(--born-fg); border-radius:3px; padding:0 4px;
                font-size:10px; line-height:16px; white-space:nowrap; display:inline-flex; align-items:center; gap:2px; }
  .badge-type { border-radius:3px; padding:0 4px; display:inline-flex; align-items:center; justify-content:center;
                font-size:10px; line-height:16px; white-space:nowrap; flex:none; }
  .leaf .badge-type { width:16px; height:16px; padding:0; }
  .t-pitfall   { background:var(--pitfall-bg); color:var(--pitfall-fg); }
  .t-note      { background:var(--note-bg); color:var(--note-fg); }
  .t-rule      { background:var(--rule-bg); color:var(--rule-fg); }
  .t-reference { background:var(--ref-bg); color:var(--ref-fg); }
  .badge-mand  { background:var(--mand-bg); color:var(--mand-fg); border-radius:3px; padding:0 4px; font-size:10px; line-height:16px; }
  .badge-draft { background:none; color:var(--draft-fg); border:1px dashed var(--draft-bd); border-radius:3px; padding:0 4px; font-size:10px; line-height:14px; }
  .tag { background:var(--tag-bg); color:var(--tag-fg); border-radius:4px; padding:0 6px; font-size:12px; }
  .d-attrs .badge-type, .d-attrs .badge-born, .d-attrs .badge-mand, .d-attrs .badge-draft { font-size:12px; line-height:20px; }
  .d-attrs .badge-type { width:auto; height:auto; padding:0 6px; }

  /* markdown 正文（照抄 v2） */
  .md h1 { font-size:18px; margin:18px 0 8px; }
  .md h2 { font-size:16px; margin:16px 0 6px; }
  .md h3 { font-size:14px; margin:14px 0 6px; }
  .md p { margin:8px 0; }
  .md code { background:var(--code-bg); border-radius:4px; padding:1px 5px; font:13px "Cascadia Code",Consolas,monospace; }
  .md pre { background:var(--pre-bg); color:var(--pre-fg); border-radius:8px; padding:12px 14px; overflow-x:auto; }
  .md pre code { background:none; color:inherit; padding:0; }
  .md ul,.md ol { margin:8px 0; padding-left:24px; }

  .placeholder { flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; }

  /* 按钮 / 输入控件（照抄 v2） */
  .btn { padding:6px 14px; border:1px solid var(--border); border-radius:6px; background:var(--card);
         font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover:not(:disabled) { border-color:var(--primary); color:var(--primary); }
  .btn:disabled { opacity:.5; cursor:not-allowed; border-color:var(--border); color:var(--muted); }
  .btn-primary:disabled { background:var(--hover); border-color:var(--border); color:var(--muted); opacity:1; filter:none; }
  .btn-primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn-primary:hover:not(:disabled) { color:#fff; filter:brightness(1.08); }
  .pinput, .pselect { padding:5px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--fg); font-size:13px; }
  .pinput:focus, .pselect:focus { outline:none; border-color:var(--primary); }
  .radio { accent-color:var(--primary); }
  .fb2 { font-size:12px; color:var(--ok); }

  /* ================================================================
     编辑态（本稿新增）：详情区变等高 flex 列——顶部操作行 + 字段组 + 正文撑满
     ================================================================ */
  .detail.editing { display:flex; flex-direction:column; overflow:hidden; padding-bottom:20px; }
  .editbar { display:flex; align-items:center; gap:8px; margin:8px 0 14px; flex:none; }
  .editbar .eb-title { font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .editbar .eb-sub { color:var(--muted); font-size:12px; font-weight:400; }
  .editbar .eb-acts { margin-left:auto; display:flex; align-items:center; gap:8px; }
  /* 字段组：小标签在上、控件在下；标签不吃固定宽，纵向排布给正文让位 */
  .ef { margin-bottom:10px; flex:none; }
  .ef-label { font-size:12px; color:var(--muted); font-weight:600; margin-bottom:4px; }
  .ef .pinput { width:100%; }
  /* 元信息行：类型/tags/mandatory 三个小控件收进一行，tags 弹性占满 */
  .ef-meta { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
  .ef-meta .ef { margin-bottom:0; }
  .ef-meta .ef-tags { flex:1; min-width:220px; }
  .ef-mand { display:flex; align-items:center; gap:6px; padding-bottom:6px; font-size:13px; cursor:pointer; }
  /* 正文：分组占满剩余高度（主要诉求），textarea 不允许拖拽变形 */
  .ef-grow { flex:1; display:flex; flex-direction:column; min-height:0; margin-bottom:0; }
  .ef-grow .ef-label { display:flex; align-items:center; gap:8px; }
  .ef-grow .ef-label .hint { font-weight:400; }
  textarea.ef-body { flex:1; min-height:0; resize:none; font:13px/1.7 Consolas,"Cascadia Code",monospace; }

  /* ================================================================
     优化对照态（本稿新增）：小字段紧凑 old→new 对照 + 正文左右分栏。
     cmp-* 配色照抄 web/style.css 对照预览弹窗（old=灰底 / new=绿底）。
     ================================================================ */
  .detail.compare { display:flex; flex-direction:column; overflow:hidden; padding-bottom:20px; }
  .cmp-basis { font-size:12px; font-weight:400; color:var(--muted); }
  .cmp-note { font-size:12px; color:var(--muted); }
  .cmp-fill { font-size:12px; padding:1px 10px; }
  .cmp-tag { display:inline-block; font-size:11px; border-radius:4px; padding:0 6px; }
  .cmp-tag.old { background:var(--border); color:var(--muted); }
  .cmp-tag.new { background:var(--ok); color:#fff; }
  /* 小字段对照：一行一个，old（删除线灰）→ new（绿），右端单字段回填 */
  .cmp-meta { flex:none; border:1px solid var(--border); border-radius:8px; background:var(--card);
              padding:8px 14px; margin-bottom:12px; }
  .cmp-mrow { display:flex; align-items:baseline; gap:10px; padding:4px 0; font-size:12.5px; }
  .cmp-mrow + .cmp-mrow { border-top:1px dashed var(--border); }
  .cmp-mrow .k { color:var(--muted); flex:none; font-weight:600; font-size:12px; white-space:nowrap; }
  .cmp-mrow .old { color:var(--muted); text-decoration:line-through; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:34%; }
  .cmp-mrow .arrow { color:var(--muted); flex:none; }
  .cmp-mrow .new { color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  .cmp-mrow .cmp-fill { margin-left:auto; flex:none; }
  /* 正文分栏：两栏等高、各自滚动 */
  .cmp-split { flex:1; display:flex; gap:12px; min-height:0; }
  .cmp-pane { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--card);
              border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .cmp-pane.new { border-color:var(--ok); }
  .cmp-pane-head { padding:6px 12px; border-bottom:1px solid var(--border); font-size:12px; font-weight:600;
                   display:flex; align-items:center; gap:8px; flex:none; }
  .cmp-pane-head .cmp-fill { margin-left:auto; }
  .cmp-pane-body { flex:1; overflow-y:auto; padding:12px 16px; font:13px/1.7 Consolas,"Cascadia Code",monospace;
                   white-space:pre-wrap; word-break:break-word; }
  .cmp-pane.old .cmp-pane-body { color:var(--muted); background:var(--hover); }
</style>
</head>

/* ================= 极简 markdown 渲染（照抄 v2） ================= */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
}
function renderMd(src){
  const lines = src.split("\n"); let html="", i=0;
  while(i<lines.length){
    const l = lines[i];
    if(l.startsWith("```")){
      const buf=[]; i++;
      while(i<lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++; html += "<pre><code>"+esc(buf.join("\n"))+"</code></pre>"; continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if(h){ html += "<h"+h[1].length+">"+inline(h[2])+"</h"+h[1].length+">"; i++; continue; }
    if(/^\s*[-*]\s+/.test(l)){
      const items=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/,""));
      html += "<ul>"+items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>"; continue;
    }
    if(l.trim()===""){ i++; continue; }
    html += "<p>"+inline(l)+"</p>"; i++;
  }
  return html;
}

}

function renderTree(){
  const tree = el("div","tree");
  const head = el("div","tree-head");
  head.appendChild(Object.assign(el("span","caption"),{textContent:t("treeCaption")}));
  tree.appendChild(head);
  const search = el("input","search");
  search.placeholder = t("filter"); search.value = state.q;
  search.oninput = ()=>{ state.q = search.value; fillTree(scroll); };
  tree.appendChild(search);
  const scroll = el("div","tree-scroll");
  tree.appendChild(scroll);
  fillTree(scroll);
  return tree;
}
function fillTree(scroll){
  scroll.innerHTML = "";
  const q = state.q.trim().toLowerCase();
  PROJECTS.forEach(p=>{
    const list = p.entries.filter(e=>!q || e.title.toLowerCase().includes(q));
    if(!list.length) return;
    const open = q ? true : !!state.open[p.name];
    const pj = el("button","tn-proj"+(open?" open":""));
    pj.innerHTML = '<span class="caret">▶</span><span class="folder">'+ICON.folder+'</span>'+esc(p.name)+'<span class="cnt">'+list.length+'</span>';
    pj.title = p.root;
    pj.onclick = ()=>{ state.open[p.name]=!state.open[p.name]; render(); };
    scroll.appendChild(pj);
    if(open){
      const kids = el("div","tn-kids");
      list.forEach(e=>{
        const leaf = el("button","leaf"+(state.sel===e?" sel":""));
        leaf.innerHTML = '<span class="l1">'+badges(e)
          +(e.mandatory?'<span class="badge-mand">★</span>':"")
          +(e.draft?'<span class="badge-draft">'+t("draft")+'</span>':"")+'</span>'
          +'<span class="t2">'+esc(e.title)+'</span>';
        leaf.onclick = ()=>{ state.sel=e; DRAFT=null; state.view="read"; render(); };
        kids.appendChild(leaf);
      });
      scroll.appendChild(kids);
    }
  });
}

  const bodyF = el("div","ef ef-grow");
  const bl = el("div","ef-label");
  bl.textContent = t("fBody");
  bl.appendChild(Object.assign(el("span","hint"),{textContent:"· "+t("fBodyHint")}));
  bodyF.appendChild(bl);
  const fBody = el("textarea","pinput ef-body"); fBody.value = DRAFT.body;
  fBody.oninput = ()=>{ DRAFT.body=fBody.value; dirtyChk(); };
  bodyF.appendChild(fBody);
  d.appendChild(bodyF);

  save.disabled = true;
  save.onclick = ()=>{
    // 保存成功：写回条目（原型为内存假数据），三按钮随编辑态消失，回到只读详情
    e.title=fTitle.value; e.type=fType.value;
    e.tags=fTags.value.split(",").map(s=>s.trim()).filter(Boolean);
    e.mandatory=fMand.checked; e.summary=fSummary.value; e.body=fBody.value;
    DRAFT=null; setView("read");
    state.savedFb = true; render();
    setTimeout(()=>{ state.savedFb=false; render(); }, 1500);
  };
  opt.onclick = ()=>{
    if(!fBody.value.trim()) return;
    opt.disabled = true; opt.textContent = t("optBusy");   // 假耗时 700ms → 对照态
    setTimeout(()=>{ state.view="cmp"; render(); }, 700);
  };
  return d;
}
function efField(label, input){
  const f = el("div","ef");
  f.appendChild(Object.assign(el("div","ef-label"),{textContent:label}));
  f.appendChild(input);
  return f;
}

/* 优化对照态：小字段 old→new 紧凑对照（逐字段回填）+ 正文左右分栏 + 全部接受/放弃 */
function renderCmp(){
  const e = state.sel;
  const d = el("div","detail compare");
  d.appendChild(Object.assign(el("div","d-path"),
    {textContent:projOf(e).root+"\\"+e.file.replace(/\//g,"\\")}));

  // 顶部操作行：标题 + 依据 | tokens + 放弃 / 全部接受并回填
  const bar = el("div","editbar");
  const bt = el("span","eb-title");
  bt.textContent = t("cmpTitle");
  bt.appendChild(Object.assign(el("span","cmp-basis"),{textContent:" · "+t("cmpBasis")}));
  bar.appendChild(bt);
  const acts = el("span","eb-acts");
  acts.appendChild(Object.assign(el("span","cmp-note"),
    {textContent:t("cmpUsage").replace("{t}",OPTIMIZED.usage.prompt+OPTIMIZED.usage.completion)
      .replace("{p}",OPTIMIZED.usage.prompt).replace("{c}",OPTIMIZED.usage.completion)}));
  const discard = el("button","btn"); discard.textContent = t("cmpDiscard");
  discard.onclick = ()=>{ state.view="edit"; render(); };   // 放弃 → 回编辑态（表单不动）
  const apply = el("button","btn btn-primary"); apply.textContent = t("cmpApply");
  apply.onclick = ()=>{ fillAll(); state.view="edit"; render(); };   // 接受 → 回填草稿回编辑态
  acts.appendChild(discard); acts.appendChild(apply);
  bar.appendChild(acts);
  d.appendChild(bar);

  // 小字段对照（标题/tags/摘要）：old → new 一行一个，右端逐字段回填
  const meta = el("div","cmp-meta");
  [["title","fTitle"],["tags","fTags"],["summary","fSummary"]].forEach(([key,labelKey])=>{
    const row = el("div","cmp-mrow");
    row.appendChild(Object.assign(el("span","k"),{textContent:t(labelKey)}));
    const newVal = key==="tags" ? OPTIMIZED.tags.join(", ") : OPTIMIZED[key];
    row.appendChild(Object.assign(el("span","old"),{textContent:DRAFT[key]}));
    row.appendChild(Object.assign(el("span","arrow"),{textContent:"→"}));
    row.appendChild(Object.assign(el("span","new"),{textContent:newVal}));
    const fill = el("button","btn cmp-fill"); fill.textContent = t("cmpFill");
    fill.onclick = ()=>{ DRAFT[key]=newVal; fill.textContent=t("cmpFilled"); fill.disabled=true; };
    row.appendChild(fill);
    meta.appendChild(row);
  });
  d.appendChild(meta);

  // 正文左右分栏对照
  const split = el("div","cmp-split");
  const pnOld = el("div","cmp-pane old");
  const hOld = el("div","cmp-pane-head");
  hOld.innerHTML = '<span class="cmp-tag old">'+t("cmpOld")+'</span>';
  pnOld.appendChild(hOld);
  pnOld.appendChild(Object.assign(el("div","cmp-pane-body"),{textContent:DRAFT.body}));
  const pnNew = el("div","cmp-pane new");
  const hNew = el("div","cmp-pane-head");
  hNew.innerHTML = '<span class="cmp-tag new">'+t("cmpNew")+'</span>';
  const fillBody = el("button","btn cmp-fill"); fillBody.textContent = t("cmpFill");
  fillBody.onclick = ()=>{ DRAFT.body=OPTIMIZED.body; fillBody.textContent=t("cmpFilled"); fillBody.disabled=true; };
  hNew.appendChild(fillBody);
  pnNew.appendChild(hNew);
  pnNew.appendChild(Object.assign(el("div","cmp-pane-body"),{textContent:OPTIMIZED.body}));
  split.appendChild(pnOld); split.appendChild(pnNew);
  d.appendChild(split);

  const note = el("div","cmp-note");
  note.style.marginTop = "8px";
  note.textContent = t("cmpNote");
  d.appendChild(note);
  return d;
}
function fillAll(){
  DRAFT.title = OPTIMIZED.title;
  DRAFT.tags = OPTIMIZED.tags.join(", ");
  DRAFT.summary = OPTIMIZED.summary;
  DRAFT.body = OPTIMIZED.body;
}

/* 锚点切态：#edit / #cmp 直接进入对应态（供评审与截图） */
(function(){
  const h = location.hash.replace(/^#/,"");
  if(h==="edit" || h==="cmp") setView(h);
  else render();
})();
</script>
