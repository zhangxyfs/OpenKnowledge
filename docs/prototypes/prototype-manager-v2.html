<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · OkManager 管理页（收敛版 v2）</title>
<!--
  一次性原型（throwaway）v2：v1 三变体评审后的收敛设计，不再多变体。
  定稿要素：
    - 顶栏左侧折叠按钮（◫）切换侧栏两态：展开=图标+文字菜单 / 收起=纯图标栏
    - 菜单五项固定：管理/引导/设置/日志/其他
    - 树 = v1 变体 B 的紧凑形态（顶部过滤框；叶节点首行徽标、次行标题）
    - 详情 = v1 变体 A 的文档流（相对路径/文件名+大小+时间/标题/tags+mandatory/摘要/markdown 正文）
    - 顶栏右侧：中/EN 语言切换 + 日/夜主题切换
  数据为样例；昼夜主题走 CSS 变量（data-theme），语言走 i18n 字典（data 内容不翻译）。
-->
<style>
  :root {
    --bg:#f5f6f8; --fg:#1f2329; --muted:#6b7280; --border:#d9dce1;
    --card:#ffffff; --primary:#2563eb; --sel-bg:#eff6ff; --sel-fg:#1d4ed8;
    --hover:#f3f4f6; --menu-bg:#ffffff; --code-bg:#f1f5f9; --pre-bg:#14171f; --pre-fg:#d6dae4;
    --born-bg:#4E5D73; --born-fg:#fff;
    --pitfall-bg:#fee2e2; --pitfall-fg:#b91c1c;
    --note-bg:#dbeafe; --note-fg:#1d4ed8;
    --rule-bg:#ede9fe; --rule-fg:#6d28d9;
    --ref-bg:#e0e7ff; --ref-fg:#3730a3;
    --mand-bg:#fef3c7; --mand-fg:#92400e;
    --draft-fg:#6b7280; --draft-bd:#d1d5db;
    --tag-bg:#eef2f7; --tag-fg:#475569;
  }
  [data-theme="dark"] {
    --bg:#14171f; --fg:#d6dae4; --muted:#8a8f9c; --border:#262c38;
    --card:#1a1f2a; --primary:#79b8ff; --sel-bg:#24304a; --sel-fg:#79b8ff;
    --hover:#1f2430; --menu-bg:#0f1218; --code-bg:#0f1218; --pre-bg:#0f1218; --pre-fg:#d6dae4;
    --born-bg:#4E5D73; --born-fg:#fff;
    --pitfall-bg:#3f1d1d; --pitfall-fg:#f87171;
    --note-bg:#1e2a45; --note-fg:#79b8ff;
    --rule-bg:#2a2340; --rule-fg:#c4b5fd;
    --ref-bg:#232a45; --ref-fg:#a5b4fc;
    --mand-bg:#3a2f14; --mand-fg:#fbbf24;
    --draft-fg:#8a8f9c; --draft-bd:#3a4150;
    --tag-bg:#232a38; --tag-fg:#aab2c0;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--fg); transition:background .15s,color .15s; }
  button { font:inherit; color:inherit; }

  .proto-banner { position:fixed; top:10px; right:230px; z-index:99; background:#fff7ed; border:1px solid #fdba74; color:#9a3412; padding:3px 10px; border-radius:6px; font-size:12px; }
  [data-theme="dark"] .proto-banner { background:#3a2a14; }

  /* ---------- 顶栏 ---------- */
  .topbar { display:flex; align-items:center; gap:10px; height:52px; padding:0 14px;
            background:var(--card); border-bottom:1px solid var(--border); }
  .collapse-btn { width:32px; height:32px; border:none; background:none; border-radius:6px;
                  cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .collapse-btn:hover { background:var(--hover); color:var(--fg); }
  .brand { font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; }
  .brand .logo { width:22px; height:22px; border-radius:6px; background:var(--primary); color:#fff;
                 display:flex; align-items:center; justify-content:center; font-size:12px; }
  /* 中/EN 胶囊切换（仿 OpenViking 右上角）；margin-left:auto 把右侧控件组推到顶栏尾部 */
  .lang-seg { display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; margin-left:auto; }
  .lang-seg button { border:none; background:none; padding:4px 12px; cursor:pointer; font-size:12px; color:var(--muted); }
  .lang-seg button.on { background:var(--fg); color:var(--bg); font-weight:600; }
  .theme-btn { width:32px; height:32px; border:none; background:none; border-radius:999px;
               cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .theme-btn:hover { background:var(--hover); color:var(--fg); }

  /* ---------- 主体 ---------- */
  .main { display:flex; height:calc(100vh - 52px); }

  /* 侧栏：展开 180px（图标+文字）/ 收起 52px（纯图标），同一棵 DOM 两种形态 */
  .side { width:180px; background:var(--menu-bg); border-right:1px solid var(--border);
          padding:10px 8px; display:flex; flex-direction:column; gap:2px;
          transition:width .15s; overflow:hidden; flex:none; }
  .side.collapsed { width:52px; padding:10px 4px; }
  .mi { display:flex; align-items:center; gap:10px; padding:9px 12px; border:none; background:none;
        border-radius:6px; color:var(--muted); cursor:pointer; text-align:left; width:100%; white-space:nowrap; }
  .mi:hover { background:var(--hover); color:var(--fg); }
  .mi.active { background:var(--sel-bg); color:var(--sel-fg); font-weight:600; }
  .mi .ico { width:18px; flex:none; display:flex; align-items:center; justify-content:center; }
  .mi .tip { display:none; }  /* 仅收起态悬停时显示，展开态绝不渲染 */
  .side.collapsed .mi { padding:9px 0; justify-content:center; position:relative; }
  .side.collapsed .mi .txt { display:none; }
  .side.collapsed .mi .tip { position:fixed; margin-left:46px; margin-top:-30px; background:#111827; color:#fff;
                             font-size:12px; padding:3px 10px; border-radius:4px; white-space:nowrap; z-index:50; }
  .side.collapsed .mi:hover .tip { display:block; }

  /* 树（v1-B 形态：过滤框 + 紧凑叶节点） */
  .tree { width:272px; background:var(--card); border-right:1px solid var(--border);
          display:flex; flex-direction:column; flex:none; }
  .tree-head { padding:10px 10px 6px; display:flex; gap:6px; align-items:center; }
  .tree-head .caption { font-size:12px; font-weight:600; color:var(--muted); margin-right:auto; }
  .search { margin:0 10px 8px; padding:5px 10px; border:1px solid var(--border); border-radius:6px;
            width:calc(100% - 20px); background:var(--bg); color:var(--fg); font-size:12.5px; }
  .search::placeholder { color:var(--muted); }
  .tree-scroll { overflow-y:auto; flex:1; padding:0 6px 10px; }
  .tn-proj { display:flex; align-items:center; gap:5px; width:100%; border:none; background:none;
             padding:5px 8px; border-radius:6px; cursor:pointer; font-weight:600; text-align:left; font-size:13px; }
  .tn-proj:hover { background:var(--hover); }
  .tn-proj .caret { width:12px; color:var(--muted); transition:transform .12s; flex:none; font-size:10px; }
  .tn-proj.open .caret { transform:rotate(90deg); }
  .tn-proj .folder { color:var(--muted); display:flex; flex:none; }
  .tn-proj .cnt { margin-left:auto; color:var(--muted); font-size:11px; font-weight:400; }
  .tn-kids { margin-left:15px; border-left:1px solid var(--border); padding-left:4px; }
  .leaf { display:block; width:100%; border:none; background:none; text-align:left;
          padding:4px 7px; border-radius:6px; cursor:pointer; }
  .leaf:hover { background:var(--hover); }
  .leaf.sel { background:var(--sel-bg); box-shadow:inset 2px 0 0 var(--primary); }
  .leaf .l1 { display:flex; gap:4px; align-items:center; }
  .leaf .t2 { display:block; font-size:12.5px; line-height:1.45; color:var(--fg); overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }
  .leaf.sel .t2 { color:var(--sel-fg); }
  .leaf.archived .t2 { color:var(--muted); text-decoration:line-through; }

  /* 详情（v1-A 文档流） */
  .detail { flex:1; overflow-y:auto; padding:20px 28px 60px; }
  .d-path { font:12px/1.5 "Cascadia Code",Consolas,monospace; color:var(--muted); word-break:break-all; }
  .d-filemeta { color:var(--muted); font-size:13px; margin-top:2px; }
  .d-filemeta b { color:var(--fg); font-weight:600; }
  .d-title { font-size:20px; margin:10px 0 6px; }
  .d-attrs { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .d-summary { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--primary);
               border-radius:6px; padding:10px 14px; margin-bottom:16px; }
  .d-body { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:18px 22px; }

  /* 徽标（紧凑化：10px、细圆角，树内不抢视线） */
  .badge-born { background:var(--born-bg); color:var(--born-fg); border-radius:3px; padding:0 4px;
                font-size:10px; line-height:16px; white-space:nowrap; display:inline-flex; align-items:center; gap:2px; }
  .badge-type { border-radius:3px; padding:0 4px; display:inline-flex; align-items:center; justify-content:center;
                font-size:10px; line-height:16px; white-space:nowrap; flex:none; }
  .leaf .badge-type { width:16px; height:16px; padding:0; }  /* 方块紧凑态只限管理页树内 */
  .t-pitfall   { background:var(--pitfall-bg); color:var(--pitfall-fg); }
  .t-note      { background:var(--note-bg); color:var(--note-fg); }
  .t-rule      { background:var(--rule-bg); color:var(--rule-fg); }
  .t-reference { background:var(--ref-bg); color:var(--ref-fg); }
  .badge-mand  { background:var(--mand-bg); color:var(--mand-fg); border-radius:3px; padding:0 4px; font-size:10px; line-height:16px; }
  .badge-draft { background:none; color:var(--draft-fg); border:1px dashed var(--draft-bd); border-radius:3px; padding:0 4px; font-size:10px; line-height:14px; }
  .badge-arch  { background:var(--hover); color:var(--muted); border-radius:3px; padding:0 4px; font-size:10px; line-height:16px; }
  .tag { background:var(--tag-bg); color:var(--tag-fg); border-radius:4px; padding:0 6px; font-size:12px; }
  /* 详情区徽标恢复常规尺寸 */
  .d-attrs .badge-type, .d-attrs .badge-born, .d-attrs .badge-mand, .d-attrs .badge-draft, .d-attrs .badge-arch { font-size:12px; line-height:20px; }
  .d-attrs .badge-type { width:auto; height:auto; padding:0 6px; }

  /* markdown 正文 */
  .md h1 { font-size:18px; margin:18px 0 8px; }
  .md h2 { font-size:16px; margin:16px 0 6px; }
  .md h3 { font-size:14px; margin:14px 0 6px; }
  .md p { margin:8px 0; }
  .md code { background:var(--code-bg); border-radius:4px; padding:1px 5px; font:13px "Cascadia Code",Consolas,monospace; }
  .md pre { background:var(--pre-bg); color:var(--pre-fg); border-radius:8px; padding:12px 14px; overflow-x:auto; }
  .md pre code { background:none; color:inherit; padding:0; }
  .md ul,.md ol { margin:8px 0; padding-left:24px; }

  .placeholder { flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; }

  /* ================================================================
     日志页：三来源（ok / daemon / sidecar）实时日志查看器，2s 轮询，只读。
     工具行=来源 chip + 语义 chip + 过滤框 + 行数统计 + 自动刷新开关；
     主体为深色控制台（两主题下都保持深色），滚动贴底。
     ================================================================ */
  .logs { flex:1; display:flex; flex-direction:column; padding:20px 28px; min-height:0; }
  .logbar { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .logchip { font-size:11.5px; padding:3px 11px; border-radius:999px; cursor:pointer;
             border:1px solid transparent; user-select:none; background:var(--hover); color:var(--muted); }
  .logchip.on-ok      { background:var(--ok-bg); color:var(--ok); }
  .logchip.on-daemon  { background:var(--sel-bg); color:var(--sel-fg); }
  .logchip.on-sidecar { background:var(--mand-bg); color:var(--mand-fg); }
  .logchip.on-sem     { background:var(--rule-bg); color:var(--rule-fg); }
  .logfilter { flex:1; min-width:160px; padding:5px 10px; border:1px solid var(--border); border-radius:6px;
               background:var(--card); color:var(--fg); font-size:12.5px; }
  .logmeta { margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; }
  .logbody { flex:1; overflow-y:auto; background:var(--pre-bg); color:var(--pre-fg); border-radius:10px;
             padding:12px 14px; font:12.5px/1.75 Consolas,monospace; white-space:pre-wrap; word-break:break-all; }
  .logbody .ls { display:inline-block; min-width:56px; font-weight:700; }
  .logbody .ls-ok { color:#4ade80; } .logbody .ls-daemon { color:#60a5fa; } .logbody .ls-sidecar { color:#fbbf24; }
  .logbody .sem { color:#c084fc; } .logbody .sem.off { color:#4b5563; }
  .logbody .empty { color:#6b7280; }

  /* ---------- 其他页：复用 pcard 卡片语言；删除卡用危险红边 ---------- */
  .misc { flex:1; overflow-y:auto; padding:20px 28px 60px; }
  .pcard.danger { border-color:#f0b4b4; }
  [data-theme="dark"] .pcard.danger { border-color:#5b2b2b; }
  .pcard.danger h3 { color:#dc2626; }
  [data-theme="dark"] .pcard.danger h3 { color:#f87171; }
  .about-line { color:var(--muted); font-size:12.5px; margin:3px 0; }
  .about-line .mono { font-family:Consolas,monospace; }
  .modal .md { font-size:13px; }

  /* ================================================================
     引导页（agent 接入卡片，自 prototype-setup.html 整合；未检测到的不渲染）
     ================================================================ */
  .setup { flex:1; overflow-y:auto; padding:20px 28px 60px; }
  .setup-head { display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  .setup-head .stat { font-size:15px; }
  .setup-head .stat b { font-size:17px; }
  .setup-head .stat .ok { color:var(--ok); font-weight:600; }
  .setup-head .sub { color:var(--muted); font-size:12.5px; }
  .setup-head .btn { margin-left:auto; }
  .acards { display:flex; flex-direction:column; gap:10px; }
  .acard { background:var(--card); border:1px solid var(--border); border-radius:10px;
           padding:14px 18px; display:flex; gap:14px; align-items:flex-start; }
  .aicon { width:38px; height:38px; border-radius:9px; flex:none; display:flex; align-items:center;
           justify-content:center; font-weight:700; font-size:13px; color:#fff; letter-spacing:.3px; overflow:hidden; }
  .aicon svg { width:100%; height:100%; display:block; }
  .aicon svg[width="20"] { width:20px; height:20px; }  /* logoSvg() 生成的字形保持 20px 不铺满 */
  .aicon img { width:100%; height:100%; display:block; }
  .amain { flex:1; min-width:0; }
  .arow1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .aname { font-weight:700; font-size:14.5px; }
  .akind { font-size:10.5px; padding:1px 7px; border-radius:999px; letter-spacing:.5px; }
  .k-hook   { background:var(--sel-bg); color:var(--sel-fg); }
  .k-plugin { background:var(--rule-bg); color:var(--rule-fg); }
  .adesc { color:var(--muted); font-size:12.5px; margin-top:2px; }
  .adetect { font-size:12px; margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .adetect .path { font-family:Consolas,monospace; font-size:11.5px; color:var(--muted);
                   background:var(--code-bg); border-radius:4px; padding:0 6px; }
  .adetect .yes { color:var(--ok); }
  .aside2 { display:flex; align-items:center; gap:8px; flex:none; padding-top:2px; flex-wrap:wrap; justify-content:flex-end; }
  .chip { font-size:11.5px; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .chip.on  { background:var(--ok-bg); color:var(--ok); }
  .chip.off { background:var(--hover); color:var(--muted); }
  .fb { font-size:12px; color:var(--ok); margin-top:4px; display:none; }
  .fb.show { display:block; }
  .detail-toggle { background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; padding:0; }
  .detail-toggle:hover { color:var(--primary); }
  .adetail { display:none; margin-top:6px; font-size:12px; color:var(--muted); background:var(--bg);
             border-radius:6px; padding:8px 12px; }
  .adetail.open { display:block; }
  .adetail code { background:var(--code-bg); border-radius:4px; padding:0 5px; font-size:11.5px; }
  :root { --ok:#16a34a; --ok-bg:#dcfce7; }
  [data-theme="dark"] { --ok:#4ade80; --ok-bg:#14301e; }
  .btn { padding:6px 14px; border:1px solid var(--border); border-radius:6px; background:var(--card);
         font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover:not(:disabled) { border-color:var(--primary); color:var(--primary); }
  .btn:disabled { opacity:.5; cursor:not-allowed; border-color:var(--border); color:var(--muted); }
  /* 禁用态的保存按钮用中性灰（有改动可保存时才亮起主色），不做"褪色的蓝" */
  .btn-primary:disabled { background:var(--hover); border-color:var(--border); color:var(--muted); opacity:1; filter:none; }
  .btn-primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn-primary:hover:not(:disabled) { color:#fff; filter:brightness(1.08); }
  .btn-danger { border-color:#dc2626; color:#dc2626; }
  .btn-danger:hover:not(:disabled) { background:#dc2626; border-color:#dc2626; color:#fff; }
  .btn-danger:disabled { border-color:var(--border); color:var(--muted); }

  /* ================================================================
     设置页：功能卡片竖排；交互统一「勾选+保存」两段式（项目既定约定），
     每张卡独立 dirty → 保存 → 已保存反馈。字段全部对应 config.toml 真实小节。
     ================================================================ */
  .prefs { flex:1; overflow-y:auto; padding:20px 28px 60px; }
  .pcard { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 20px; margin-bottom:12px; }
  .pcard h3 { margin:0 0 2px; font-size:14.5px; display:flex; align-items:center; gap:8px; }
  .pcard .pdesc { color:var(--muted); font-size:12.5px; margin-bottom:12px; }
  .prow { display:flex; align-items:center; gap:10px; margin:8px 0; flex-wrap:wrap; }
  .prow .k { width:140px; color:var(--muted); font-size:13px; flex:none; }
  .pinput, .pselect { padding:5px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--fg); font-size:13px; }
  .pinput:focus, .pselect:focus { outline:none; border-color:var(--primary); }
  .pfoot { margin-top:12px; display:flex; align-items:center; gap:10px; }
  .pfoot .fb2 { font-size:12px; color:var(--ok); }
  .switch { position:relative; width:38px; height:22px; border-radius:999px; background:var(--border); border:none; cursor:pointer; transition:background .15s; flex:none; padding:0; }
  .switch.on { background:var(--ok); }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; }
  .switch.on::after { left:19px; }
  .prof { display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin:6px 0; cursor:pointer; }
  .prof.sel { border-color:var(--primary); background:var(--sel-bg); }
  .prof .info { display:flex; align-items:center; gap:6px; min-width:0; flex:1; }
  .prof .info b { white-space:nowrap; }
  .prof .mono { font-family:Consolas,monospace; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .prof .radio { accent-color:var(--primary); }
  table.rules { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.rules th { text-align:left; color:var(--muted); font-weight:600; padding:4px 8px; border-bottom:1px solid var(--border); }
  table.rules td { padding:4px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  table.rules .pinput { width:100%; padding:3px 8px; font-size:12.5px; }
  .sec-label { font-size:12px; color:var(--muted); font-weight:600; margin:12px 0 4px; }
  /* 门控短语弹窗 */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:80; }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:10px; width:640px; max-width:92vw; max-height:80vh; overflow-y:auto; padding:18px 22px; }
  .modal h3 { margin:0 0 6px; font-size:15px; }
  .ph-builtin { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
  .ph-row { display:flex; gap:6px; margin:5px 0; }
  .ph-row .pinput { flex:1; }
  .mfoot { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
</style>

function renderSetup(){
  const d = el("div","setup");
  const list = AGENTS.filter(a=>a.detected);   // 未检测到的不显示
  const head = el("div","setup-head");
  const stat = el("div","stat");
  stat.innerHTML = t("stDetected")+" <b>"+list.length+"</b> "+t("stAgentUnit")
    +' · <span class="ok">'+t("stHooked")+" <b>"+list.filter(a=>setupState[a.id].hooked).length+"</b> "+t("stHookedUnit")+"</span>";
  head.appendChild(stat);
  head.appendChild(Object.assign(el("div","sub"),{textContent:t("setupSub")}));
  const rd = el("button","btn");
  rd.textContent = setupState._detecting ? t("detecting") : t("redetect");
  rd.disabled = !!setupState._detecting;
  rd.onclick = ()=>{ setupState._detecting=true; render();
    setTimeout(()=>{ setupState._detecting=false; render(); }, 600); };
  head.appendChild(rd);
  d.appendChild(head);

  if(!list.length){
    d.appendChild(Object.assign(el("div","placeholder"),{textContent:t("noneDetected")}));
    return d;
  }
  const cards = el("div","acards");
  list.forEach(a=>{
    const s = setupState[a.id];
    const card = el("div","acard");
    const icon = el("div","aicon");
    const L = LOGOS[a.id];
    if(L && (L.raw || L.img)){
      icon.innerHTML = L.raw || '<img src="'+L.img+'" alt="">';   // 全彩图标，铺满磁贴
    } else if(L && L.padded){
      icon.style.background = L.bg||"#fff";
      if(L.border) icon.style.boxShadow = "inset 0 0 0 1px var(--border)";
      icon.innerHTML = L.padded;                    // 浅色底字形：白磁贴 24px 居中
    } else if(L){
      icon.style.background = L.bg; icon.style.color = L.fg;
      if(L.border) icon.style.boxShadow = "inset 0 0 0 1px var(--border)";
      icon.innerHTML = logoSvg(L);
    } else {
      icon.style.background = a.color; icon.textContent = a.abbr;
    }
    card.appendChild(icon);

    const main = el("div","amain");
    const r1 = el("div","arow1");
    r1.appendChild(Object.assign(el("span","aname"),{textContent:a.name}));
    const kind = el("span","akind "+(a.kind==="hook"?"k-hook":"k-plugin"));
    kind.textContent = a.kind==="hook" ? t("kindHook") : t("kindPlugin");
    r1.appendChild(kind);
    main.appendChild(r1);
    main.appendChild(Object.assign(el("div","adesc"),{textContent:state.lang==="en"?(a.descEn||a.desc):a.desc}));
    const det = el("div","adetect");
    det.innerHTML = '<span class="yes">✓</span><span>'+esc(state.lang==="en"?(a.versionEn||a.version):a.version)+'</span>'
                  + '<span class="path" title="target">'+esc(state.lang==="en"?(a.targetEn||a.target):a.target)+'</span>';
    main.appendChild(det);
    const tog = el("button","detail-toggle");
    tog.textContent = s.open ? t("detailClose") : t("detailQ");
    tog.onclick = ()=>{ s.open=!s.open; render(); };
    main.appendChild(tog);
    const dl = el("div","adetail"+(s.open?" open":""));
    dl.innerHTML = t("detailInstall")+"<code>"+esc(a.target)+"</code>"+t("detailJoin")+t("detailRemove");
    main.appendChild(dl);
    const fb = el("div","fb"+(s.fb?" show":""));
    fb.textContent = s.fb||"";
    main.appendChild(fb);
    card.appendChild(main);

    const aside = el("div","aside2");
    const ch1 = el("span","chip "+(s.hooked?"on":"off"));
    ch1.textContent = s.hooked ? t("hookOn") : t("hookOff");
    aside.appendChild(ch1);
    const ch2 = el("span","chip "+(s.skills?"on":"off"));
    ch2.textContent = s.skills ? t("skillOn") : t("skillOff");
    aside.appendChild(ch2);
    const act = el("button","btn "+(s.hooked?"btn-danger":"btn-primary"));
    act.disabled = s.busy;
    act.textContent = s.busy ? (s.hooked?t("uninstalling"):t("installing")) : (s.hooked?t("uninstall"):t("install"));
    act.onclick = ()=>toggleAgent(a);
    aside.appendChild(act);
    card.appendChild(aside);
    cards.appendChild(card);
  });
  d.appendChild(cards);
  return d;
}

/* 模拟安装/卸载：800ms 假耗时 → 状态翻转 + 可见反馈（真实现=cli.Setup/RemoveHooks） */
function toggleAgent(a){
  const s = setupState[a.id];
  s.busy = true; s.fb = ""; render();
  setTimeout(()=>{
    s.busy = false;
    s.hooked = !s.hooked;
    s.skills = s.hooked;
    s.fb = s.hooked ? t("fbInstall") : t("fbUninstall");
    render();
  }, 800);
}

function sumRow(label, content, btn){

  k.style.width = "auto"; k.style.marginRight = "6px";

function pDirty(k){ prefsDirty[k]=true; render(); }
// 实时脏态：不重渲，直接同步该卡保存按钮的禁用态（数字输入边打边响应，且改回原值即变回灰）
function pDirtyLive(k, dirty){
  prefsDirty[k]=dirty;
  document.querySelectorAll('[data-save="'+k+'"]').forEach(b=>{ b.disabled = !dirty; });
}
function pSave(k){
  prefsDirty[k]=false; prefsSaved[k]=true; render();
  setTimeout(()=>{ prefsSaved[k]=false; render(); }, 1500);
}
// 数字输入（设置卡用）：oninput 实时上报，由调用方 apply + 计算脏态；不重渲，避免丢焦点
function pnumLive(val, min, max, onVal){
  const i = el("input","pinput"); i.type="number"; i.min=min; i.max=max; i.value=val;
  i.style.width="90px";
  i.oninput = ()=>onVal(+i.value);
  return i;
}
function pcard(key, title, desc, body, inlineRow){
  const c = el("div","pcard");
  const h = el("h3"); h.textContent = title; c.appendChild(h);
  if(desc){ c.appendChild(Object.assign(el("div","pdesc"),{textContent:desc})); }
  c.appendChild(body);
  const sv = el("button","btn btn-primary");
  sv.textContent = t("save"); sv.disabled = !prefsDirty[key];
  sv.dataset.save = key;
  sv.onclick = ()=>pSave(key);
  if(inlineRow){
    // 简单输入卡：保存按钮进控件行右端，不独占页脚
    const wrap = el("span");
    wrap.style.cssText = "margin-left:auto;display:flex;align-items:center;gap:10px;flex:none";
    if(prefsSaved[key]) wrap.appendChild(Object.assign(el("span","fb2"),{textContent:t("saved")}));
    wrap.appendChild(sv);
    inlineRow.appendChild(wrap);
  } else {
    const f = el("div","pfoot");
    f.appendChild(sv);
    if(prefsSaved[key]) f.appendChild(Object.assign(el("span","fb2"),{textContent:t("saved")}));
    c.appendChild(f);
  }
  return c;
}
function prow(k, input){

  const i = el("input","pinput"); i.type="number"; i.min=min; i.max=max; i.value=val;

      const detail = cur.type==="builtin" ? builtinLabel(cur.model)
                   : (cur.model||"")+(cur.base?" @ "+cur.base:"");
      sumBody.innerHTML = '<span class="badge-type t-'+(cur.type==="builtin"?"reference":cur.type==="ollama"?"note":"rule")+'">'
        + esc(cur.type==="builtin"?t("tagBuiltin"):cur.type==="ollama"?t("tagOllama"):t("tagCustom")) + '</span>'
        + ' <b>'+esc(cur.name)+'</b> <span class="mono">'+esc(detail)+'</span>';
    } else {
      sumBody.innerHTML = '<span class="muted">'+t("eNone")+'</span>';
    }
    const mg = el("button","btn"); mg.textContent = t("eManage");
    mg.onclick = ()=>{
      embDraft = { active:prefs.embActive, timeout:prefs.embTimeout, dir:prefs.embDir,
                   profiles:JSON.parse(JSON.stringify(prefs.embProfiles)) };
      embEdit = -1; embForm = null; embModal = true; render();
    };
    c.appendChild(sumRow(t("eActive"), sumBody, mg));
    if(prefs._eFb) c.appendChild(Object.assign(el("span","fb2"),{textContent:t("saved")}));
    d.appendChild(c);
  }
  // 3. 模型配置（LLM）：与 embedding 同构——摘要行 + 管理配置弹窗，确定即生效
  {
    const c = el("div","pcard");
    const h = el("h3"); h.textContent = t("lTitle"); c.appendChild(h);
    c.appendChild(Object.assign(el("div","pdesc"),{textContent:t("lDesc")}));
    const cur = prefs.llmProfiles.find(p=>p.name===prefs.llmActive);
    const sumBody = el("span");
    if(cur){
      sumBody.innerHTML = '<span class="badge-type t-'+(cur.kind==="anthropic"?"pitfall":"rule")+'">'
        + esc(cur.kind==="anthropic"?t("tagAnthropic"):t("tagOpenai")) + '</span>'
        + ' <b>'+esc(cur.name)+'</b> <span class="mono">'+esc(cur.model+(cur.base?" @ "+cur.base:""))+'</span>';
    } else {
      sumBody.innerHTML = '<span class="muted">'+t("eNone")+'</span>';
    }
    const mg = el("button","btn"); mg.textContent = t("eManage");
    mg.onclick = ()=>{
      llmDraft = { active:prefs.llmActive, timeout:prefs.llmTimeout,
                   profiles:JSON.parse(JSON.stringify(prefs.llmProfiles)) };
      llmEdit = -1; llmForm = null; llmModal = true; render();
    };
    c.appendChild(sumRow(t("eActive"), sumBody, mg));
    if(prefs._lFb) c.appendChild(Object.assign(el("span","fb2"),{textContent:t("saved")}));
    d.appendChild(c);
  }
  // 4. Hook 超时
  {
    const b = el("div");
    const orig = prefs.hookTimeout;
    const row = prow(t("hSec"), pnumLive(prefs.hookTimeout,1,120,v=>{
      prefs.hookTimeout=v; pDirtyLive("h", v!==orig);
    }));
    b.appendChild(row);
    d.appendChild(pcard("h", t("hTitle"), t("hDesc"), b, row));
  }
  // 5. 跨轮注入冷却
  {
    const b = el("div");
    const orig = prefs.dedupTurns;
    const row = prow(t("cTurns"), pnumLive(prefs.dedupTurns,0,99,v=>{
      prefs.dedupTurns=v; pDirtyLive("c", v!==orig);
    }));
    b.appendChild(row);
    d.appendChild(pcard("c", t("cTitle"), t("cDesc"), b, row));
  }
  // 6. 经验沉淀：保存按钮收进「轮次间隔」行右端；模式+间隔合并判脏，改回原值即变回灰
  {
    const b = el("div");
    const orig = { mode:prefs.capMode, interval:prefs.capInterval };
    const chk = ()=>pDirtyLive("cap", prefs.capMode!==orig.mode || prefs.capInterval!==orig.interval);
    const modeRow = el("div","prow");
    modeRow.appendChild(Object.assign(el("span","k"),{textContent:t("capMode")}));
    [["propose",t("capPropose")],["auto",t("capAuto")]].forEach(([v,label])=>{
      const lab = el("label","prow"); lab.style.margin="0";
      const rd = el("input"); rd.type="radio"; rd.name="capmode"; rd.className="radio";
      rd.checked = prefs.capMode===v;
      rd.onchange = ()=>{ prefs.capMode=v; chk(); };
      lab.appendChild(rd); lab.appendChild(document.createTextNode(label));
      modeRow.appendChild(lab);
    });
    b.appendChild(modeRow);
    const iRow = prow(t("capInterval"), pnumLive(prefs.capInterval,1,99,v=>{
      prefs.capInterval=v; chk();
    }));
    b.appendChild(iRow);
    d.appendChild(pcard("cap", t("capTitle"), t("capDesc"), b, iRow));
  }
  // 7. 泛化门控：单行布局（开关即开即存，短语表弹窗内编辑、确定即生效），无保存按钮
  {
    const c = el("div","pcard");
    const h = el("h3"); h.textContent = t("gtTitle"); c.appendChild(h);
    c.appendChild(Object.assign(el("div","pdesc"),{textContent:t("gtDesc")}));
    const r = el("div","prow");
    r.style.margin = "0";
    r.appendChild(Object.assign(el("span","k"),{textContent:t("gtOn")}));
    r.appendChild(pswitch(prefs.gateOn, ()=>{
      prefs.gateOn = !prefs.gateOn; prefs._gtFb = true; render();
      setTimeout(()=>{ prefs._gtFb = false; render(); }, 1500);
    }));
    r.appendChild(Object.assign(el("span","muted"),{textContent:t("gtStatus").replace("{n}",prefs.gateExtra.length)}));
    const right = el("span");
    right.style.cssText = "margin-left:auto;display:flex;align-items:center;gap:10px;flex:none";
    if(prefs._gtFb) right.appendChild(Object.assign(el("span","fb2"),{textContent:t("saved")}));
    const mg = el("button","btn"); mg.textContent = t("gtManage");
    mg.onclick = ()=>{ gateDraft = prefs.gateExtra.slice(); gateModal = true; render(); };
    right.appendChild(mg);
    r.appendChild(right);
    c.appendChild(r);
    d.appendChild(c);
  }
  // 8. 规则配置：保存按钮收进「添加规则」行右端
  {
    const b = el("div");
    const tb = el("table","rules");
    tb.innerHTML = "<thead><tr><th style='width:110px'>"+t("rType")+"</th><th>"+t("rGlobs")+"</th><th>"+t("rCl")+"</th><th>"+t("rMsg")+"</th><th style='width:40px'></th></tr></thead>";
    const tbBody = el("tbody");
    prefs.rules.forEach((r,idx)=>{
      const tr = el("tr");
      const td0 = el("td");
      const sel = el("select","pselect");
      ["changelog"].forEach(o=>{ const op=el("option"); op.value=o; op.textContent=o; sel.appendChild(op); });
      sel.value = r.type;
      sel.onchange = ()=>{ r.type=sel.value; pDirty("r"); };
      td0.appendChild(sel); tr.appendChild(td0);
      [["globs"],["cl"],["msg"]].forEach(([f])=>{
        const td = el("td");
        td.appendChild(ptext(r[f], v=>{ r[f]=v; pDirty("r"); }));
        tr.appendChild(td);
      });
      const tdX = el("td");
      const del = el("button","btn"); del.textContent = "×"; del.style.padding="2px 10px";
      del.onclick = ()=>{ prefs.rules.splice(idx,1); pDirty("r"); };
      tdX.appendChild(del); tr.appendChild(tdX);
      tbBody.appendChild(tr);
    });
    tb.appendChild(tbBody);
    b.appendChild(tb);
    const addRow = el("div");
    addRow.style.cssText = "display:flex;align-items:center;margin-top:8px";
    const add = el("button","btn"); add.textContent = t("rAdd");
    add.onclick = ()=>{ prefs.rules.push({type:"changelog",globs:"",cl:"",msg:""}); pDirty("r"); };
    addRow.appendChild(add);
    b.appendChild(addRow);
    d.appendChild(pcard("r", t("rTitle"), t("rDesc"), b, addRow));
  }

  if(gateModal) d.appendChild(renderGateModal());
  if(embModal) d.appendChild(renderEmbModal());
  if(llmModal) d.appendChild(renderLlmModal());
  return d;
}

function renderGateModal(){
  const mask = el("div","mask");
  const m = el("div","modal");
  m.appendChild(Object.assign(el("h3"),{textContent:t("gtManage")}));
  // 内置短语：只读列表（与 embedding/LLM 弹窗同款的 .prof 行样式）
  m.appendChild(Object.assign(el("div","sec-label"),{textContent:t("gtBuiltin")}));
  GATE_BUILTIN.forEach(p=>{
    const row = el("div","prof");
    row.style.cursor = "default";
    row.appendChild(Object.assign(el("span","info"),{textContent:p}));
    m.appendChild(row);
  });
  const more = el("div","prof");
  more.style.cursor = "default";
  more.appendChild(Object.assign(el("span","info muted"),{textContent:"… +15"}));
  m.appendChild(more);
  // 自定义短语：列表（可删）+ 文本框与添加按钮
  m.appendChild(Object.assign(el("div","sec-label"),{textContent:t("gtCustom")}));
  gateDraft.forEach((p,idx)=>{
    const row = el("div","prof");
    row.style.cursor = "default";
    row.appendChild(Object.assign(el("span","info"),{textContent:p}));
    const del = el("button","btn btn-danger"); del.textContent = t("eDel");
    del.style.cssText = "margin-left:auto;padding:2px 10px;flex:none";
    del.onclick = ()=>{ gateDraft.splice(idx,1); render(); };
    row.appendChild(del);
    m.appendChild(row);
  });
  const addRow = el("div","ph-row");
  const inp = ptext("", ()=>{});
  inp.placeholder = t("gtPh");
  const add = el("button","btn"); add.textContent=t("gtAdd"); add.style.flex="none";
  const doAdd = ()=>{ const v = inp.value.trim(); if(v){ gateDraft.push(v); render(); } };
  add.onclick = doAdd;
  inp.onkeydown = e=>{ if(e.key==="Enter") doAdd(); };
  addRow.appendChild(inp); addRow.appendChild(add);
  m.appendChild(addRow);
  const foot = el("div","mfoot");
  const cancel = el("button","btn"); cancel.textContent = t("fCancel");
  cancel.onclick = ()=>{ gateModal=false; render(); };
  const ok = el("button","btn btn-primary"); ok.textContent = t("fOk");
  ok.onclick = ()=>{ prefs.gateExtra = gateDraft.filter(s=>s.trim()); gateModal=false;
    prefs._gtFb = true; render();
    setTimeout(()=>{ prefs._gtFb = false; render(); }, 1500); };
  foot.appendChild(cancel); foot.appendChild(ok);
  m.appendChild(foot);
  mask.appendChild(m);
  mask.onclick = e=>{ if(e.target===mask){ gateModal=false; render(); } };
  return mask;
}

/* embedding 服务管理弹窗：列表（设为使用中/编辑/删除）+ 按类型切换的内联表单
  （字段结构照抄现有 GUI：builtin=模型下拉+下载源，ollama=地址+模型，openai=base_url+模型+key；
   类型保存后锁定，仅新增可改）；超时与模型目录收在弹窗「全局」段。确定即生效。 */
function renderEmbModal(){
  const mask = el("div","mask");
  const m = el("div","modal");
  m.appendChild(Object.assign(el("h3"),{textContent:t("eTitle")+" · "+t("eProfiles")}));

  embDraft.profiles.forEach((p,idx)=>{
    const row = el("div","prof"+(embDraft.active===p.name?" sel":""));
    row.style.cursor = "default";
    const info = el("span","info");
    const detail = p.type==="builtin" ? builtinLabel(p.model) : (p.model||"")+(p.base?" @ "+p.base:"");
    info.innerHTML = '<span class="badge-type t-'+(p.type==="builtin"?"reference":p.type==="ollama"?"note":"rule")+'">'
      + esc(p.type==="builtin"?t("tagBuiltin"):p.type==="ollama"?t("tagOllama"):t("tagCustom")) + '</span>'
      + ' <b>'+esc(p.name)+'</b> <span class="mono">'+esc(detail)+'</span>';
    row.appendChild(info);
    const acts = el("span");
    acts.style.cssText = "margin-left:auto;display:flex;gap:6px;flex:none";
    if(embDraft.active===p.name){
      acts.appendChild(Object.assign(el("span","chip on"),{textContent:t("eActive")}));
    } else {
      const sa = el("button","btn"); sa.textContent = t("eSetActive"); sa.style.padding="2px 10px";
      sa.onclick = ()=>{ embDraft.active = p.name; render(); };
      acts.appendChild(sa);
    }
    const ed = el("button","btn"); ed.textContent = t("eEdit"); ed.style.padding="2px 10px";
    ed.onclick = ()=>{ embEdit = idx; embForm = JSON.parse(JSON.stringify(p)); render(); };
    acts.appendChild(ed);
    const del = el("button","btn btn-danger"); del.textContent = t("eDel"); del.style.padding="2px 10px";
    del.onclick = ()=>{
      if(embDraft.active===p.name) embDraft.active = "";
      embDraft.profiles.splice(idx,1);
      if(embEdit===idx){ embEdit=-1; embForm=null; }
      render();
    };
    acts.appendChild(del);
    row.appendChild(acts);
    m.appendChild(row);
  });

  if(embForm){
    m.appendChild(Object.assign(el("div","sec-label"),
      {textContent:embEdit===-2?t("eAddTitle"):t("eEditTitle")}));
    m.appendChild(prow(t("fName"), ptext(embForm.name||"", v=>{ embForm.name=v; }, "300px")));
    // 类型：保存后锁定，仅新增可改（沿用现有 GUI 语义）
    const typeRow = el("div","prow");
    typeRow.appendChild(Object.assign(el("span","k"),{textContent:t("fType")}));
    const sel = el("select","pselect");
    [["builtin",t("typeBuiltin")],["ollama",t("typeOllama")],["openai",t("typeOpenai")]].forEach(([v,label])=>{
      const op=el("option"); op.value=v; op.textContent=label; sel.appendChild(op);
    });
    sel.value = embForm.type||"openai";
    sel.disabled = embEdit >= 0;
    sel.onchange = ()=>{ embForm.type = sel.value; render(); };
    typeRow.appendChild(sel);
    m.appendChild(typeRow);
    // 按类型切换字段组
    const ty = embForm.type||"openai";
    if(ty==="builtin"){
      const mRow = el("div","prow");
      mRow.appendChild(Object.assign(el("span","k"),{textContent:t("fModel")}));
      const mSel = el("select","pselect"); mSel.style.maxWidth="420px";
      BUILTIN_MODELS.forEach(bm=>{
        const op=el("option"); op.value=bm.id;
        op.textContent = bm.label + (bm.downloaded?t("downloaded"):"");
        mSel.appendChild(op);
      });
      mSel.value = embForm.model||BUILTIN_MODELS[0].id;
      mSel.onchange = ()=>{ embForm.model = mSel.value; };
      mRow.appendChild(mSel);
      m.appendChild(mRow);
      const miRow = el("div","prow");
      miRow.appendChild(Object.assign(el("span","k"),{textContent:t("fMirror")}));
      const miSel = el("select","pselect");
      [["hf-mirror",t("mirrorHf")],["huggingface",t("mirrorOfficial")]].forEach(([v,label])=>{
        const op=el("option"); op.value=v; op.textContent=label; miSel.appendChild(op);
      });
      miSel.value = embForm.mirror||"hf-mirror";
      miSel.onchange = ()=>{ embForm.mirror = miSel.value; };
      miRow.appendChild(miSel);
      m.appendChild(miRow);
    } else if(ty==="ollama"){
      m.appendChild(prow(t("fOlUrl"), ptext(embForm.base||"http://localhost:11434", v=>{ embForm.base=v; }, "300px")));
      m.appendChild(prow(t("fModel"), ptext(embForm.model||"", v=>{ embForm.model=v; }, "300px")));
    } else {
      m.appendChild(prow(t("fBase"), ptext(embForm.base||"", v=>{ embForm.base=v; }, "300px")));
      m.appendChild(prow(t("fModel"), ptext(embForm.model||"", v=>{ embForm.model=v; }, "300px")));
      const keyIn = ptext(embForm.key||"", v=>{ embForm.key=v; }, "300px");
      keyIn.placeholder = embEdit>=0 ? t("keySaved") : "api_key";
      m.appendChild(prow(t("fKey"), keyIn));
    }
    const frow = el("div","prow");
    frow.appendChild(el("span","k"));
    const ok = el("button","btn btn-primary"); ok.textContent = t("fOk");
    ok.onclick = ()=>{
      if(!(embForm.name||"").trim()) return;
      if(embEdit===-2) embDraft.profiles.push(JSON.parse(JSON.stringify(embForm)));
      else embDraft.profiles[embEdit] = JSON.parse(JSON.stringify(embForm));
      embEdit=-1; embForm=null; render();
    };
    const cancel = el("button","btn"); cancel.textContent = t("fCancel");
    cancel.onclick = ()=>{ embEdit=-1; embForm=null; render(); };
    frow.appendChild(ok); frow.appendChild(cancel);
    m.appendChild(frow);
  } else {
    const add = el("button","btn"); add.textContent = t("eAdd"); add.style.marginTop="8px";
    add.onclick = ()=>{ embEdit=-2; embForm={type:"builtin"}; render(); };
    m.appendChild(add);
  }

  // 全局段：调用超时 + 内置模型目录（属于 [embedding] 全局，不属于单个 profile）
  m.appendChild(Object.assign(el("div","sec-label"),{textContent:t("eGlobal")}));
  m.appendChild(prow(t("eTimeout"), pnum(embDraft.timeout,1,300,v=>{embDraft.timeout=v;})));
  m.appendChild(prow(t("eDir"), ptext(embDraft.dir,v=>{embDraft.dir=v;},"360px")));

  const foot = el("div","mfoot");
  const cancel = el("button","btn"); cancel.textContent = t("fCancel");
  cancel.onclick = ()=>{ embModal=false; embDraft=null; render(); };
  const ok = el("button","btn btn-primary"); ok.textContent = t("fOk");
  ok.onclick = ()=>{
    prefs.embProfiles = embDraft.profiles;
    prefs.embActive = embDraft.active;
    prefs.embTimeout = embDraft.timeout;
    prefs.embDir = embDraft.dir;
    embModal=false; embDraft=null;
    prefs._eFb=true; render();
    setTimeout(()=>{ prefs._eFb=false; render(); }, 1500);
  };
  foot.appendChild(cancel); foot.appendChild(ok);
  m.appendChild(foot);
  mask.appendChild(m);
  mask.onclick = e=>{ if(e.target===mask){ embModal=false; embDraft=null; render(); } };
  return mask;
}

/* LLM 服务管理弹窗：与 embedding 弹窗同构。kind 两档（OpenAI/Anthropic 兼容），

    del.onclick = ()=>{
      if(llmDraft.active===p.name) llmDraft.active = "";
      llmDraft.profiles.splice(idx,1);
      if(llmEdit===idx){ llmEdit=-1; llmForm=null; }

    acts.appendChild(del);

/* ================= 极简 markdown 渲染 ================= */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
}
function renderMd(src){
  const lines = src.split("\n"); let html="", i=0;
  while(i<lines.length){
    const l = lines[i];
    if(l.startsWith("```")){
      const buf=[]; i++;
      while(i<lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++; html += "<pre><code>"+esc(buf.join("\n"))+"</code></pre>"; continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if(h){ html += "<h"+h[1].length+">"+inline(h[2])+"</h"+h[1].length+">"; i++; continue; }
    if(/^\s*[-*]\s+/.test(l)){
      const items=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/,""));
      html += "<ul>"+items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>"; continue;
    }
    if(l.trim()===""){ i++; continue; }
    html += "<p>"+inline(l)+"</p>"; i++;
  }
  return html;
}

function el(tag, cls){ const n=document.createElement(tag); if(cls) n.className=cls; return n; }

/* ================= 日志页 ================= */
/* 三来源（ok=CLI/hook 客户端、daemon=守护进程、sidecar=embed 边车）实时日志查看器。
   生产语义：2s 轮询 /api/logs?tail=400&sig=…（签名不变回 unchanged 跳过重绘），只读。
   原型用本地样例行 + 2s 定时追加模拟轮询；工具行交互即时生效，不重渲整页。 */
const LOG_TEMPLATES = [
  { src:"ok",      sem:true,  text:'hook UserPromptSubmit · retrieve "{Q}" → 注入 {N} 条（{A} 坑 {B} 注）' },
  { src:"ok",      sem:false, text:"hook PostToolUse · changelog 校验通过" },
  { src:"ok",      sem:true,  text:"capture propose · 沉淀草稿 1 条待批准" },
  { src:"daemon",  sem:false, text:"HTTP 127.0.0.1:8585 · GET /api/logs · 200 · {MS}ms" },
  { src:"daemon",  sem:false, text:"config reload · config.toml mtime 变化，已生效" },
  { src:"daemon",  sem:false, text:"gc · 过期草稿清理 0 条" },
  { src:"sidecar", sem:false, text:"embed qwen3-local · {TOK} tokens · {MS}ms" },
  { src:"sidecar", sem:false, text:"model warm · Qwen3-Embedding-0.6B Q8_0" },
];
const LOG_QUERIES = ["配置中心 原型","daemon 单写者","跨项目 记忆交叉","hook 超时","embedding 下载源"];
const LOG_LINES = [];
let logClock = 11*3600 + 18*60;   // 当日秒数，逐行推进
function genLogLine(){
  const tp = LOG_TEMPLATES[Math.floor(Math.random()*LOG_TEMPLATES.length)];
  logClock += 2 + Math.floor(Math.random()*20);
  const hh = String(Math.floor(logClock/3600)%24).padStart(2,"0");
  const mm = String(Math.floor(logClock/60)%60).padStart(2,"0");
  const ss = String(logClock%60).padStart(2,"0");
  const text = tp.text
    .replace("{Q}", LOG_QUERIES[Math.floor(Math.random()*LOG_QUERIES.length)])
    .replace("{N}", 1+Math.floor(Math.random()*4))
    .replace("{A}", Math.floor(Math.random()*3)).replace("{B}", Math.floor(Math.random()*2))
    .replace(/\{MS\}/g, 2+Math.floor(Math.random()*40))
    .replace("{TOK}", 80+Math.floor(Math.random()*400));
  return { src:tp.src, sem:tp.sem, text:"2026-08-21 "+hh+":"+mm+":"+ss+" "+text };
}
for(let i=0;i<26;i++) LOG_LINES.push(genLogLine());

let logBodyEl = null, logMetaEl = null;
function paintLogs(){
  if(!logBodyEl) return;
  const q = state.logQ.trim().toLowerCase();
  let count = 0, html = "";
  LOG_LINES.forEach(l=>{
    if(!state.logSrc[l.src]) return;
    if(state.logSem && !l.sem) return;
    if(q && l.text.toLowerCase().indexOf(q)<0) return;
    count++;
    html += '<span class="ls ls-'+l.src+'">'+l.src+'</span>'
          + '<span class="sem'+(l.sem?"":" off")+'">'+(l.sem?"◆":"◇")+'</span> '
          + esc(l.text)+"\n";
  });
  logBodyEl.innerHTML = count ? html : '<span class="empty">'+t("lgEmpty")+'</span>';
  if(state.logStick) logBodyEl.scrollTop = logBodyEl.scrollHeight;
  if(logMetaEl) logMetaEl.textContent =
    t("lgMeta").replace("{n}",LOG_LINES.length).replace("{m}",count);
}

function renderLogs(){
  const d = el("div","logs");
  const bar = el("div","logbar");
  [["ok","on-ok"],["daemon","on-daemon"],["sidecar","on-sidecar"]].forEach(([src,cls])=>{
    const c = el("span","logchip"+(state.logSrc[src]?" "+cls:""));
    c.textContent = src;
    c.onclick = ()=>{ state.logSrc[src]=!state.logSrc[src]; c.classList.toggle(cls, state.logSrc[src]); paintLogs(); };
    bar.appendChild(c);
  });
  const sem = el("span","logchip"+(state.logSem?" on-sem":""));
  sem.textContent = t("lgSemantic");
  sem.onclick = ()=>{ state.logSem=!state.logSem; sem.classList.toggle("on-sem", state.logSem); paintLogs(); };
  bar.appendChild(sem);
  const f = el("input","logfilter");
  f.placeholder = t("lgFilter"); f.value = state.logQ;
  f.oninput = ()=>{ state.logQ = f.value; paintLogs(); };
  bar.appendChild(f);
  const meta = el("span","logmeta");
  logMetaEl = el("span");
  meta.appendChild(logMetaEl);
  meta.appendChild(Object.assign(el("span"),{textContent:t("lgAuto")}));
  const sw = pswitch(state.logAuto, ()=>{
    state.logAuto = !state.logAuto; sw.classList.toggle("on", state.logAuto);
  });
  meta.appendChild(sw);
  bar.appendChild(meta);
  d.appendChild(bar);
  logBodyEl = el("div","logbody");
  logBodyEl.addEventListener("scroll", ()=>{
    state.logStick = logBodyEl.scrollHeight - logBodyEl.scrollTop - logBodyEl.clientHeight < 40;
  });
  d.appendChild(logBodyEl);
  paintLogs();
  return d;
}

/* 模拟 2s 轮询：仅日志页可见且自动刷新开启时追加样例行（上限 400，对齐生产 tail） */
setInterval(()=>{
  if(state.menu!=="logs" || !state.logAuto) return;
  LOG_LINES.push(genLogLine());
  if(LOG_LINES.length>400) LOG_LINES.shift();
  paintLogs();
}, 2000);

  if(!p){ state.delTarget = null; return el("div"); }
  const mask = el("div","mask");
  const m = el("div","modal");
  m.appendChild(Object.assign(el("h3"),{textContent:t("xDel")}));
  const impact = el("div","pdesc");
  impact.textContent = t("xDelImpact").replace("{p}",p.name).replace("{n}",p.entries.length);
  m.appendChild(impact);
  const backup = el("input"); backup.type = "checkbox"; backup.checked = true; backup.className = "radio";
  const lb = el("label","prow"); lb.style.margin = "6px 0";
  lb.appendChild(backup); lb.appendChild(document.createTextNode(t("xDelBackup")));
  m.appendChild(lb);
  const ack = el("input"); ack.type = "checkbox"; ack.className = "radio";
  const la = el("label","prow"); la.style.margin = "6px 0";
  la.appendChild(ack); la.appendChild(document.createTextNode(t("xDelAck")));
  m.appendChild(la);
  const nameRow = el("div","prow");
  nameRow.appendChild(Object.assign(el("span","k"),{textContent:t("xDelHint")}));
  const nameIn = ptext("", ()=>{}, "220px");
  nameIn.placeholder = p.name;
  nameRow.appendChild(nameIn);
  m.appendChild(nameRow);
  const foot = el("div","mfoot");
  const cancel = el("button","btn"); cancel.textContent = t("fCancel");
  cancel.onclick = ()=>{ state.delTarget = null; render(); };
  const confirm = el("button","btn btn-danger"); confirm.textContent = t("xDelConfirm");
  confirm.disabled = true;
  const upd = ()=>{ confirm.disabled = !(ack.checked && nameIn.value.trim()===p.name); };
  ack.onchange = upd; nameIn.oninput = upd;
  confirm.onclick = ()=>{
    const idx = PROJECTS.indexOf(p);
    if(idx>=0) PROJECTS.splice(idx,1);
    delete state.open[p.name];
    if(state.sel && p.entries.indexOf(state.sel)>=0) state.sel = null;
    state.delTarget = null;
    flashMiscFb("del:"+p.name);
  };
  foot.appendChild(cancel); foot.appendChild(confirm);
  m.appendChild(foot);
  mask.appendChild(m);
  mask.onclick = e=>{ if(e.target===mask){ state.delTarget = null; render(); } };
  return mask;
}

/* 刷新恢复选中菜单：菜单点击时写入 location.hash，启动时读回（非法值回退 manage） */
(function(){
  const h = location.hash.replace(/^#/,"");
  if(MENUS.some(m=>m.key===h)) state.menu = h;
})();

render();
</script>
