  详情字段序=相对路径/文件名+大小+时间/标题/tags+mandatory/摘要/markdown 正文。
  数据为手工样例（OpenKnowledge 项目为真实条目节选）。色板沿用 web/style.css
  与知识库既定约定：born 徽标实心 #4E5D73 白字；type 四色。
-->
<style>

  body { margin:0; font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  button { font:inherit; }

  #switcher { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#111827; color:#fff; border-radius:999px; padding:8px 10px; display:flex; gap:10px; align-items:center; box-shadow:0 6px 20px rgba(0,0,0,.3); font-size:13px; z-index:99; }

  #switcher button:hover { background:#4b5563; }
  #switcher .lbl { min-width:250px; text-align:center; }
  .proto-banner { position:fixed; top:10px; right:12px; z-index:99; background:#fff7ed; border:1px solid #fdba74; color:#9a3412; padding:4px 10px; border-radius:6px; font-size:12px; }

  /* ---------- 徽标（沿用现有约定） ---------- */

  .t-pitfall   { background:#fee2e2; color:#b91c1c; }
  .t-note      { background:#dbeafe; color:#1d4ed8; }
  .t-rule      { background:#ede9fe; color:#6d28d9; }
  .t-reference { background:#e0e7ff; color:#3730a3; }
  .badge-mand  { background:#fef3c7; color:#92400e; border-radius:4px; padding:0 6px; font-size:11px; }
  .badge-draft { background:#f3f4f6; color:#6b7280; border:1px dashed #d1d5db; border-radius:4px; padding:0 6px; font-size:11px; }
  .badge-arch  { background:#f3f4f6; color:#9ca3af; border-radius:4px; padding:0 6px; font-size:11px; }
  .tag { background:#eef2f7; color:#475569; border-radius:4px; padding:0 6px; font-size:12px; }

  /* ================================================================
     变体 A — 三栏文档流（浅色，贴 web/style.css 视觉语言）
     ================================================================ */
  .a-root { display:flex; height:100vh; background:#f5f6f8; color:#1f2329; }
  .a-menu { width:180px; background:#fff; border-right:1px solid #d9dce1; padding:12px 8px; display:flex; flex-direction:column; gap:2px; }
  .a-brand { font-weight:700; font-size:15px; padding:6px 12px 14px; }
  .a-menu .mi { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:6px; color:#6b7280; cursor:pointer; border:none; background:none; text-align:left; width:100%; }
  .a-menu .mi:hover { background:#f3f4f6; color:#1f2329; }
  .a-menu .mi.active { background:#eff6ff; color:#2563eb; font-weight:600; }
  .a-menu .ico { width:18px; text-align:center; }
  .a-tree { width:340px; background:#fff; border-right:1px solid #d9dce1; overflow-y:auto; padding:8px 6px; }
  .a-detail { flex:1; overflow-y:auto; padding:20px 28px 80px; }

  .tn-proj:hover { background:#f3f4f6; }
  .tn-proj .caret { width:14px; color:#9ca3af; transition:transform .12s; }

  .tn-proj .cnt { margin-left:auto; color:#9ca3af; font-size:12px; font-weight:400; }
  .tn-kids { margin-left:16px; border-left:1px solid #e5e7eb; padding-left:6px; }
  .tn-leaf { display:flex; align-items:center; gap:6px; width:100%; border:none; background:none; padding:5px 8px; border-radius:6px; cursor:pointer; text-align:left; color:#374151; }
  .tn-leaf:hover { background:#f3f4f6; }
  .tn-leaf.sel { background:#eff6ff; color:#1d4ed8; }
  .tn-leaf .ttl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tn-leaf.archived .ttl { color:#9ca3af; text-decoration:line-through; }

  .d-filemeta { color:#6b7280; font-size:13px; margin-top:2px; }

  .d-title { font-size:20px; margin:10px 0 6px; }
  .d-attrs { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .d-summary { background:#fff; border:1px solid #d9dce1; border-left:3px solid #2563eb; border-radius:6px; padding:10px 14px; color:#374151; margin-bottom:16px; }
  .d-body { background:#fff; border:1px solid #d9dce1; border-radius:8px; padding:18px 22px; }

  .md code { background:#f1f5f9; border-radius:4px; padding:1px 5px; font:13px "Cascadia Code",Consolas,monospace; }

  .b-menu .mi:hover { background:#2d3340; color:#fff; }

  .b-leaf { display:block; width:100%; border:none; background:none; text-align:left; padding:6px 8px; border-radius:6px; cursor:pointer; }

  .b-leaf.sel { background:#eff6ff; box-shadow:inset 2px 0 0 #2563eb; }

  .b-card td { padding:2px 14px 2px 0; vertical-align:top; }
  .b-card td.k { color:#6b7280; white-space:nowrap; }
  .b-body { max-width:760px; margin:0 auto; background:#fff; border:1px solid #d9dce1; border-radius:10px; padding:20px 28px; }

  .c-tn-kids { margin-left:15px; border-left:1px solid #2b3242; padding-left:6px; }
  .c-tn-leaf { display:flex; align-items:center; gap:6px; width:100%; border:none; background:none; color:#aab2c0; padding:5px 8px; border-radius:6px; cursor:pointer; text-align:left; }

  .c-crumb b { color:#aab2c0; font-weight:600; }
  .c-meta { display:flex; gap:18px; flex-wrap:wrap; background:#1a1f2a; border:1px solid #262c38; border-radius:8px; padding:10px 16px; font-size:12px; margin-bottom:14px; }

  .c-meta .kv span { color:#d6dae4; }
  .c-title { font-size:19px; margin:4px 0 8px; color:#fff; }
  .c-summary { color:#8a8f9c; border-left:3px solid #79b8ff; padding:4px 12px; margin-bottom:16px; }
  .c-body { background:#1a1f2a; border:1px solid #262c38; border-radius:8px; padding:18px 22px; }
  .c-body.md code, .c-body .md code { background:#0f1218; color:#7ee787; }
  .c-root .md pre { background:#0f1218; border:1px solid #262c38; }

  .placeholder { flex:1; display:flex; align-items:center; justify-content:center; color:#9ca3af; font-size:15px; }
</style>

function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
}
function renderMd(src){
  const lines = src.split("\n"); let html="", i=0;
  while(i<lines.length){
    const l = lines[i];
    if(l.startsWith("```")){
      let buf=[]; i++;
      while(i<lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++; html += "<pre><code>"+esc(buf.join("\n"))+"</code></pre>"; continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if(h){ html += "<h"+h[1].length+">"+inline(h[2])+"</h"+h[1].length+">"; i++; continue; }
    if(/^\s*[-*]\s+/.test(l)){
      let items=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/,""));
      html += "<ul>"+items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>"; continue;
    }
    if(l.trim()===""){ i++; continue; }
    html += "<p>"+inline(l)+"</p>"; i++;
  }
  return html;
}

/* ================= 状态 ================= */
const state = { menu:"manage", open:{ "OpenKnowledge":true }, sel:null };

function badges(e){
  let s = '<span class="badge-born" title="出生分支">⎇ '+e.born+'</span>'
        + '<span class="badge-type t-'+e.type+'" title="类型 '+e.type+'">'+TYPE_LABEL[e.type]+'</span>';
  return s;
}
function detailAttrs(e){
  let s = e.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join("");
  s += e.mandatory ? '<span class="badge-mand">★ mandatory</span>' : '<span class="tag" style="opacity:.6">非 mandatory</span>';
  if(e.draft) s += '<span class="badge-draft">草稿</span>';
  if(e.archived) s += '<span class="badge-arch">已归档</span>';
  return s;
}

/* ================= 变体 A — 三栏文档流 ================= */
function renderA(){
  const r = el("div","a-root");
  // 菜单
  const menu = el("div","a-menu");
  menu.appendChild(Object.assign(el("div","a-brand"),{textContent:"OkManager"}));
  MENUS.forEach(m=>{
    const b = el("button","mi"+(state.menu===m.key?" active":""));
    b.innerHTML = '<span class="ico">'+m.ico+'</span>'+m.label;
    b.onclick = ()=>{ state.menu=m.key; draw(); };
    menu.appendChild(b);
  });
  r.appendChild(menu);
  if(state.menu!=="manage"){ r.appendChild(placeholder("「"+MENUS.find(m=>m.key===state.menu).label+"」页原型未实现 —— 本次只评管理页")); return r; }
  // 树
  const tree = el("div","a-tree");
  PROJECTS.forEach(p=>{
    const open = !!state.open[p.name];
    const pj = el("button","tn-proj"+(open?" open":""));
    pj.innerHTML = '<span class="caret">▶</span>📁 '+esc(p.name)+'<span class="cnt">'+p.entries.length+'</span>';
    pj.title = p.root;
    pj.onclick = ()=>{ state.open[p.name]=!open; draw(); };
    tree.appendChild(pj);
    if(open){
      const kids = el("div","tn-kids");
      p.entries.forEach(e=>{
        const leaf = el("button","tn-leaf"+(state.sel===e?" sel":"")+(e.archived?" archived":""));
        leaf.innerHTML = badges(e)+'<span class="ttl">'+esc(e.title)+'</span>';
        leaf.onclick = ()=>{ state.sel=e; draw(); };
        kids.appendChild(leaf);
      });
      tree.appendChild(kids);
    }
  });
  r.appendChild(tree);
  // 详情
  const d = el("div","a-detail");
  const e = state.sel;
  if(!e){ d.appendChild(placeholder("← 从树中选择一条知识条目")); }
  else{
    d.appendChild(Object.assign(el("div","d-path"),{textContent:projOf(e).root+"\\"+e.file.replace(/\//g,"\\")}));
    const fm = el("div","d-filemeta");
    fm.innerHTML = "<b>"+esc(e.file.split("/").pop())+"</b> · "+e.size+" · 修改于 "+e.mtime;
    d.appendChild(fm);
    d.appendChild(Object.assign(el("h1","d-title"),{textContent:e.title}));
    const at = el("div","d-attrs"); at.innerHTML = detailAttrs(e); d.appendChild(at);
    const sm = el("div","d-summary"); sm.textContent = e.summary; d.appendChild(sm);
    const bd = el("div","d-body md"); bd.innerHTML = renderMd(e.body); d.appendChild(bd);
  }
  r.appendChild(d);
  return r;
}

/* ================= 变体 B — 紧凑树 + sticky 属性卡 ================= */
function renderB(){
  const r = el("div","b-root");
  const menu = el("div","b-menu");
  MENUS.forEach(m=>{
    const b = el("button","mi"+(state.menu===m.key?" active":""));
    b.innerHTML = m.ico+'<span class="tip">'+m.label+'</span>';
    b.onclick = ()=>{ state.menu=m.key; draw(); };
    menu.appendChild(b);
  });
  r.appendChild(menu);
  if(state.menu!=="manage"){ r.appendChild(placeholder("「"+MENUS.find(m=>m.key===state.menu).label+"」页原型未实现 —— 本次只评管理页")); return r; }
  const tree = el("div","b-tree");
  const search = el("input","search"); search.placeholder="🔍 过滤条目…";
  search.oninput = ()=>{ state.q = search.value; drawB(tree, search.value); };
  tree.appendChild(search);
  const scroll = el("div","scroll"); tree.appendChild(scroll);
  r.appendChild(tree);
  drawBEntries(scroll, "");
  const d = el("div","b-detail"); d.id="b-detail";
  r.appendChild(d);
  renderBDetail(d);
  // draw 后保持树内容
  requestAnimationFrame(()=>drawBEntries(scroll, state.q||""));
  return r;

  function drawB(treeEl, q){ drawBEntries(treeEl.querySelector(".scroll"), q); }
}
function drawBEntries(scroll, q){
  scroll.innerHTML="";
  q = (q||"").toLowerCase();
  PROJECTS.forEach(p=>{
    const list = p.entries.filter(e=>!q || e.title.toLowerCase().includes(q));
    if(!list.length) return;
    const open = state.open[p.name]!==false && (q? true : !!state.open[p.name]);
    const pj = el("button","tn-proj"+(open?" open":""));
    pj.innerHTML = '<span class="caret">▶</span>📁 '+esc(p.name)+'<span class="cnt">'+list.length+'</span>';
    pj.onclick = ()=>{ state.open[p.name]=!open; draw(); };
    scroll.appendChild(pj);
    if(open){
      const kids = el("div","tn-kids");
      list.forEach(e=>{
        const leaf = el("button","b-leaf"+(state.sel===e?" sel":""));
        leaf.innerHTML = '<span class="l1">'+badges(e)
          +(e.mandatory?'<span class="badge-mand">★</span>':"")
          +(e.draft?'<span class="badge-draft">草</span>':"")+'</span>'
          +'<span class="t2">'+esc(e.title)+'</span>';
        leaf.onclick = ()=>{ state.sel=e; draw(); };
        kids.appendChild(leaf);
      });
      scroll.appendChild(kids);
    }
  });
}
function renderBDetail(d){
  const e = state.sel;
  if(!e){ d.appendChild(placeholder("← 从树中选择一条知识条目")); return; }
  const card = el("div","b-card");
  card.innerHTML = '<table>'
    +'<tr><td class="k">路径</td><td style="font-family:Consolas,monospace;font-size:12px">'+esc(projOf(e).root+"\\"+e.file.replace(/\//g,"\\"))+'</td></tr>'
    +'<tr><td class="k">文件</td><td>'+esc(e.file.split("/").pop())+" · "+e.size+" · 修改于 "+e.mtime+'</td></tr>'
    +'<tr><td class="k">标题</td><td style="font-size:15px;font-weight:600">'+esc(e.title)+'</td></tr>'
    +'<tr><td class="k">属性</td><td>'+detailAttrs(e)+'</td></tr>'
    +'<tr><td class="k">摘要</td><td>'+esc(e.summary)+'</td></tr>'
    +'</table>';
  d.appendChild(card);
  const bd = el("div","b-body md"); bd.innerHTML = renderMd(e.body); d.appendChild(bd);
}

/* ================= 变体 C — 深色工作台 ================= */
function renderC(){
  const r = el("div","c-root");
  const menu = el("div","c-menu");
  MENUS.forEach(m=>{
    const b = el("button","mi"+(state.menu===m.key?" active":""));
    b.textContent = m.ico; b.title = m.label;
    b.onclick = ()=>{ state.menu=m.key; draw(); };
    menu.appendChild(b);
  });
  r.appendChild(menu);
  if(state.menu!=="manage"){ const ph=placeholder("「"+MENUS.find(m=>m.key===state.menu).label+"」页原型未实现 —— 本次只评管理页"); ph.style.color="#6b7280"; r.appendChild(ph); return r; }
  const tree = el("div","c-tree");
  PROJECTS.forEach(p=>{
    const open = !!state.open[p.name];
    const pj = el("button","c-tn-proj");
    pj.innerHTML = '<span class="caret">'+(open?"▾":"▸")+'</span>📁 '+esc(p.name);
    pj.onclick = ()=>{ state.open[p.name]=!open; draw(); };
    tree.appendChild(pj);
    if(open){
      const kids = el("div","c-tn-kids");
      p.entries.forEach(e=>{
        const leaf = el("button","c-tn-leaf"+(state.sel===e?" sel":""));
        leaf.innerHTML = badges(e)+'<span class="ttl">'+esc(e.title)+'</span>';
        leaf.onclick = ()=>{ state.sel=e; draw(); };
        kids.appendChild(leaf);
      });
      tree.appendChild(kids);
    }
  });
  r.appendChild(tree);
  const d = el("div","c-detail");
  const e = state.sel;
  if(!e){ const ph=placeholder("← 从树中选择一条知识条目"); ph.style.color="#6b7280"; d.appendChild(ph); }
  else{
    const p = projOf(e);
    const crumb = el("div","c-crumb");
    crumb.innerHTML = "<b>"+esc(p.name)+"</b> / "+esc(e.file);
    d.appendChild(crumb);
    d.appendChild(Object.assign(el("h1","c-title"),{textContent:e.title}));
    const meta = el("div","c-meta");
    meta.innerHTML = '<div class="kv"><b>文件</b><span>'+esc(e.file.split("/").pop())+'</span></div>'
      +'<div class="kv"><b>大小</b><span>'+e.size+'</span></div>'
      +'<div class="kv"><b>修改时间</b><span>'+e.mtime+'</span></div>'
      +'<div class="kv"><b>属性</b><span>'+detailAttrs(e)+'</span></div>';
    d.appendChild(meta);
    const sm = el("div","c-summary"); sm.textContent = e.summary; d.appendChild(sm);
    const bd = el("div","c-body md"); bd.innerHTML = renderMd(e.body); d.appendChild(bd);
  }
  r.appendChild(d);
  return r;
}

/* ================= 骨架 ================= */
function el(tag, cls){ const n=document.createElement(tag); if(cls) n.className=cls; return n; }
function placeholder(t){ const p=el("div","placeholder"); p.textContent=t; return p; }
function projOf(entry){ return PROJECTS.find(p=>p.entries.includes(entry)); }

const VARIANTS = [
  { key:"A", name:"三栏文档流（按需求描述）", render:renderA },
  { key:"B", name:"紧凑树 + sticky 属性卡",   render:renderB },
  { key:"C", name:"深色工作台",               render:renderC },
];
function currentVariant(){
  const v = new URLSearchParams(location.search).get("variant");
  return VARIANTS.find(x=>x.key===v) || VARIANTS[0];
}
function setVariant(key){
  const u = new URL(location.href); u.searchParams.set("variant", key);
  history.replaceState(null,"",u); draw();
}
function draw(){
  const v = currentVariant();
  document.getElementById("lbl").textContent = v.key+" — "+v.name;
  const app = document.getElementById("app");
  app.innerHTML=""; app.appendChild(v.render());
}
function step(dir){
  const i = VARIANTS.indexOf(currentVariant());
  setVariant(VARIANTS[(i+dir+VARIANTS.length)%VARIANTS.length].key);
}
document.getElementById("prev").onclick = ()=>step(-1);
document.getElementById("next").onclick = ()=>step(1);
document.addEventListener("keydown", ev=>{
  const t = ev.target;
  if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
  if(ev.key==="ArrowLeft") step(-1);
  if(ev.key==="ArrowRight") step(1);
});
draw();
</script>
