name: openknowledge
arch: amd64
platform: linux
version: ${VERSION}
maintainer: OpenKnowledge
description: |
  为 AI 编程助手提供的项目知识库：hooks 自动注入 + 混合检索 + 强制工作流规则。
  安装后运行 ok setup 完成首次引导（hooks / 技能 / embedding / 登录自启）。
homepage: https://z7dream-gitea.iepose.cn/zhangxyfs/OpenKnowledge
recommends:
  - xdg-utils
contents:
  - src: dist/linux-amd64/ok
    dst: /usr/lib/openknowledge/ok
    file_info:
      mode: 0755
  - src: dist/linux-amd64/okd
    dst: /usr/lib/openknowledge/okd
    file_info:
      mode: 0755
  - src: dist/linux-amd64/web/
    dst: /usr/lib/openknowledge/web/
  - src: dist/linux-amd64/changelogs/
    dst: /usr/lib/openknowledge/changelogs/
  # runtime 整目录 0755：Windows 宿主落盘全 0644，须强制可执行位；
  # 单列 llama-server 条目会与目录展开撞 dest（nfpm content collision），故合并为一条
  - src: dist/linux-amd64/runtime/
    dst: /usr/lib/openknowledge/runtime/
    file_info:
      mode: 0755
  - src: /usr/lib/openknowledge/ok
    dst: /usr/bin/ok
    type: symlink
